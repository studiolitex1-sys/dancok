<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCKED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #8b0000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            position: fixed;
        }
        
        /* LAYAR LOCK */
        .lock-screen {
            width: 100%;
            height: 100%;
            background: #8b0000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
        }
        
        /* CARD UTAMA - DIPERKECIL */
        .card {
            width: 90%;
            max-width: 280px;
            background: #1a1a1a;
            border: 3px solid #ff4444;
            border-radius: 25px;
            padding: 18px 12px;
            box-shadow: 0 0 40px #ff0000;
        }
        
        /* ICON - DIPERKECIL */
        .icon-box {
            text-align: center;
            margin-bottom: 2px;
        }
        
        .icon-large {
            font-size: 50px;
            line-height: 1;
        }
        
        .icon-small {
            font-size: 20px;
            line-height: 1;
            margin-top: 2px;
        }
        
        /* JUDUL - DIPERKECIL */
        h1 {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2px;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .subtitle {
            color: #ffaaaa;
            background: #330000;
            text-align: center;
            padding: 4px 12px;
            border-radius: 30px;
            width: fit-content;
            margin: 0 auto 12px;
            border: 1px solid #ff6666;
            font-weight: bold;
            font-size: 11px;
        }
        
        /* INFO PANEL - DIPERKECIL */
        .info-panel {
            background: #222222;
            border: 2px solid #cc0000;
            border-radius: 18px;
            padding: 10px;
            margin-bottom: 12px;
        }
        
        .info-title {
            color: #ffaaaa;
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 8px;
            border-bottom: 1px solid #440000;
            color: white;
            font-size: 12px;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #ffbbbb;
        }
        
        .info-value {
            color: #ff7777;
            font-weight: bold;
        }
        
        /* AREA PIN - DIPERKECIL */
        .pin-area {
            margin-bottom: 12px;
        }
        
        .pin-label {
            color: #ffcccc;
            font-size: 11px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .pin-input {
            width: 100%;
            background: black;
            border: 2px solid #ff4444;
            border-radius: 30px;
            padding: 10px 10px;
            color: white;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            font-family: monospace;
            outline: none;
        }
        
        .pin-input::placeholder {
            color: #442222;
            font-size: 12px;
            letter-spacing: 2px;
        }
        
        /* TOMBOL - DIPERKECIL */
        .btn {
            width: 100%;
            background: #cc0000;
            border: none;
            border-radius: 30px;
            padding: 10px 0;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            border: 2px solid #ffaaaa;
            box-shadow: 0 3px 0 #550000;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #550000;
        }
        
        .footer {
            text-align: center;
            color: #884444;
            font-size: 9px;
        }
        
        /* POPUP ERROR - DIPERKECIL */
        .error-popup {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: black;
            border: 2px solid red;
            border-radius: 25px;
            padding: 8px 20px;
            color: red;
            font-weight: bold;
            font-size: 13px;
            display: none;
            z-index: 100000;
            box-shadow: 0 0 30px red;
        }
        
        /* SUKSES SCREEN - DIPERKECIL */
        .success-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #004d00;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100001;
        }
        
        .success-box {
            background: #006600;
            border: 4px solid #00ff00;
            border-radius: 40px;
            padding: 25px 20px;
            text-align: center;
            width: 80%;
            max-width: 240px;
        }
        
        .success-icon {
            font-size: 50px;
        }
        
        .success-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .success-text {
            color: #aaffaa;
            font-size: 13px;
        }
        
        /* LAYAR NORMAL */
        .normal-screen {
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .normal-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .normal-text {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .normal-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 15px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- POPUP ERROR -->
    <div class="error-popup" id="errorPopup">⚠️ SALAH ⚠️</div>
    
    <!-- LAYAR KUNCIAN -->
    <div class="lock-screen" id="lockScreen">
        <div class="card">
            <div class="icon-box">
                <span class="icon-large">🔒💀🔒</span>
                <div class="icon-small">⛓️</div>
            </div>
            
            <h1>LOCKED</h1>
            <div class="subtitle">VALZZ</div>
            
            <div class="info-panel">
                <div class="info-title">⚠️ STATUS ⚠️</div>
                <div class="info-row"><span class="info-label">BACK</span><span class="info-value">BLOKIR</span></div>
                <div class="info-row"><span class="info-label">HOME</span><span class="info-value">BLOKIR</span></div>
                <div class="info-row"><span class="info-label">POWER</span><span class="info-value">BLOKIR</span></div>
                <div class="info-row"><span class="info-label">VOLUME</span><span class="info-value">BLOKIR</span></div>
            </div>
            
            <div class="pin-area">
                <div class="pin-label">🔑 PIN 6 DIGIT</div>
                <input type="tel" id="pinInput" class="pin-input" maxlength="6" inputmode="numeric" placeholder="000000" autofocus>
            </div>
            
            <button class="btn" onclick="checkPin()">UNLOCK</button>
            <div class="footer">⚡ VALZZ ⚡</div>
        </div>
    </div>

    <script>
        // PIN
        const PIN = "123456";
        
        // CEK UNLOCK
        if (localStorage.getItem('unlock') === 'ok') {
            showNormal();
        } else {
            startLock();
        }
        
        function startLock() {
            let input = document.getElementById('pinInput');
            
            // FOKUS
            setInterval(() => {
                input.focus();
                input.click();
            }, 200);
            
            // FULLSCREEN
            setInterval(() => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            }, 800);
            
            // BACK BUTTON
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', function() {
                history.pushState(null, null, location.href);
                showError('BACK');
            });
            
            document.addEventListener('backbutton', function(e) {
                e.preventDefault();
                showError('BACK');
            }, false);
            
            document.addEventListener('keydown', function(e) {
                if ((e.key >= '0' && e.key <= '9') || e.key === 'Backspace') {
                    return true;
                }
                e.preventDefault();
                return false;
            }, true);
            
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    setTimeout(() => {
                        window.focus();
                        input.focus();
                    }, 10);
                }
            });
        }
        
        function checkPin() {
            let pin = document.getElementById('pinInput').value;
            
            if (pin === PIN) {
                // SUKSES
                document.body.innerHTML += `
                    <div class="success-screen" id="success">
                        <div class="success-box">
                            <div class="success-icon">✅</div>
                            <div class="success-title">UNLOCKED</div>
                            <div class="success-text">NORMAL</div>
                        </div>
                    </div>
                `;
                
                localStorage.setItem('unlock', 'ok');
                
                // HAPUS EVENT
                window.onpopstate = null;
                document.onkeydown = null;
                
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                
                setTimeout(() => {
                    document.getElementById('lockScreen').remove();
                    document.getElementById('success').remove();
                    showNormal();
                }, 1500);
                
            } else {
                // SALAH
                document.getElementById('pinInput').value = '';
                showError('SALAH');
                
                let card = document.querySelector('.card');
                card.style.transform = 'translateX(3px)';
                setTimeout(() => card.style.transform = 'translateX(-3px)', 50);
                setTimeout(() => card.style.transform = 'translateX(2px)', 100);
                setTimeout(() => card.style.transform = 'translateX(-2px)', 150);
                setTimeout(() => card.style.transform = 'translateX(0)', 200);
            }
        }
        
        function showError(msg) {
            let pop = document.getElementById('errorPopup');
            pop.style.display = 'block';
            pop.innerHTML = '⚠️ ' + msg + ' ⚠️';
            setTimeout(() => pop.style.display = 'none', 800);
        }
        
        function showNormal() {
            document.body.innerHTML = `
                <div class="normal-screen">
                    <div class="normal-title">✅ UNLOCKED</div>
                    <div class="normal-text">BACK BUTTON NORMAL</div>
                    <button class="normal-btn" onclick="window.close()">TUTUP</button>
                </div>
            `;
        }
        
        document.getElementById('pinInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkPin();
            }
        });
    </script>
</body>
</html>
